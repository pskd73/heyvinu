; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3

; ESP32-S3-WROOM-1-N16R8 — 16 MB flash + 8 MB OPI PSRAM
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
upload_speed = 921600
upload_flags = 
	--after=watchdog_reset
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DHEYVINU_HELIX_STATIC=1
	-DHEYVINU_JOY_HORIZ_ON_Y=1
	-DHEYVINU_JOY_INVERT_HORIZ=1
	-DFLOW32_JOY_HORIZ_ON_Y=1
	-DFLOW32_JOY_INVERT_HORIZ=1
	-DWEBSOCKETS_MAX_DATA_SIZE=2097152
	; Reaches ssl_client socket_timeout via the connect() argument, which is the
	; only lever on it — setTimeout() does not touch it. A write that outlasts it
	; makes WiFiClientSecure::write() call stop(), a bare close(fd) with no
	; close_notify and no WS close frame.
	;
	; This is a wedge budget, not a patience budget: wsTask is blocked inside the
	; write for the whole duration, so nothing is received and the mic ring keeps
	; filling. Kept under TALK_MIC_UPLINK_SECONDS so a stall cannot overflow the
	; ring — at 60 s a weak link cost 59 s of dropped uplink audio, well past the
	; 60 s of silence ElevenLabs closes the socket over. Waiting longer never
	; recovered a stalled send anyway; the link had degraded, not congested.
	-DWEBSOCKETS_TCP_TIMEOUT=5000
	; PNGdec line buffer for up to 1024px-wide sources: (1024*4+1)*2
	-DPNG_MAX_BUFFERED_PIXELS=8194
	; microWakeWord / TFLite Micro
	-DTF_LITE_STATIC_MEMORY
	-DTF_LITE_DISABLE_X86_NEON
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFiClientSecure/src
build_src_filter =
	+<*>
	-<wake_models/*.tflite>
extra_scripts =
	pre:patch_websockets.py
lib_extra_dirs = ../flow32/lib
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit BusIO
  links2004/WebSockets @ ^2.4.1
	bblanchon/ArduinoJson @ ^7.2.1
	bitbank2/JPEGDEC @ ^1.8.0
	bitbank2/JPEGENC @ ^1.1.0
	bitbank2/PNGdec @ ^1.1.3
lib_ldf_mode = chain+
